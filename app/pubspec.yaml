name: illusio
description: Лаунчер Space Station 14 на Rust и Flutter.
publish_to: none
version: 0.7.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  file_selector: ^1.0.3
  google_fonts: ^6.2.1

dev_dependencies:
