name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: Illusio-windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            artifact: Illusio-linux-x64.tar.gz
          - os: macos-latest
            platform: macos
            artifact: Illusio-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build core library
        run: cargo build --release
        working-directory: core

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build loader
        shell: bash
        run: |
          RID="linux-x64"
          if [ "${{ matrix.platform }}" = "windows" ]; then RID="win-x64"; fi
          if [ "${{ matrix.platform }}" = "macos" ]; then RID="osx-arm64"; fi
          dotnet publish ../loader/Illusio.Loader.csproj -c Release -r "$RID" --self-contained true
          echo "LOADER_OUT=../loader/bin/Release/net10.0/$RID/publish" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|mirrors.edge.kernel.org|g' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo timeout 420 apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo timeout 420 apt-get install -y --no-install-recommends libgtk-3-dev ninja-build

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create . --platforms=${{ matrix.platform }} --project-name illusio

      - name: Apply app icon
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/runner/resources | Out-Null
          Copy-Item installer/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build ${{ matrix.platform }} --release

      - name: Bundle core library
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp ../core/target/release/illusio.dll build/windows/x64/runner/Release/
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp ../core/target/release/libillusio.so build/linux/x64/release/bundle/lib/
          else
            cp ../core/target/release/libillusio.dylib build/macos/Build/Products/Release/illusio.app/Contents/MacOS/
          fi

      - name: Bundle loader
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp -r "${{ env.LOADER_OUT }}" build/windows/x64/runner/Release/loader
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp -r "${{ env.LOADER_OUT }}" build/linux/x64/release/bundle/loader
          else
            cp -r "${{ env.LOADER_OUT }}" build/macos/Build/Products/Release/illusio.app/Contents/MacOS/loader
          fi

      - name: Build NSIS installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & $makensis "/DVERSION=$version" "/DSRCDIR=$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release" "/DOUTDIR=$env:GITHUB_WORKSPACE" "/DLICENSE=$env:GITHUB_WORKSPACE\LICENSE" "/DICONDIR=$env:GITHUB_WORKSPACE\app\installer" "installer\illusio.nsi"

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            (cd build/windows/x64/runner/Release && 7z a "${GITHUB_WORKSPACE}/Illusio-${VERSION}-windows-x64.zip" .)
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            tar -czf "${GITHUB_WORKSPACE}/Illusio-${VERSION}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
          else
            (cd build/macos/Build/Products/Release && zip -r -y -q "${GITHUB_WORKSPACE}/Illusio-${VERSION}-macos-arm64.zip" illusio.app)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Illusio-${{ matrix.platform }}
          path: |
            Illusio-*.zip
            Illusio-*.tar.gz
            Illusio-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Illusio-*.zip
            Illusio-*.tar.gz
            Illusio-*.exe
          generate_release_notes: true
